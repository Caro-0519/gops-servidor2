name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pruebas unitarias y de API, con cobertura
        run: node --test --experimental-test-coverage backend/unit.test.js
      - name: Pruebas de integración con proveedores de IA simulados
        run: node backend/test.js
